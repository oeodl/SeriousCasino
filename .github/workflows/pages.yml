# Veröffentlicht die Oberfläche (Ordner public/) auf GitHub Pages → https://oeodl.github.io/SeriousCasino/
# Läuft automatisch bei jedem Hochladen auf "main". Der Spiel-Server selbst läuft bei Render.
name: Seite auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Hochladen und Veröffentlichen sind (wie in GitHubs offizieller Vorlage) getrennte Jobs:
  # Liefen beide direkt nacheinander im selben Job, fand der Veröffentlichungs-Schritt die Dateien manchmal noch nicht.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Falls GitHub beim ersten Mal hakt: kurz warten und noch einmal versuchen
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
